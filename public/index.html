<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sagrada Família 3D</title>
<meta name="description" content="사그라다 파밀리아를 3D로 함께 걷는 온라인 성당. 설치·가입 없이 접속하세요.">
<meta property="og:title" content="사그라다 파밀리아 · 함께 걷기">
<meta property="og:description" content="지금 접속한 사람들과 3D 성당을 걷고, 합장하고, 초를 밝혀요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL scene, floating title top-left, one control panel bottom-left (full width on phones).
   Single committed look: dusk stone & lamplight, independent of host theme. */
:root{
  --ink:#f4ecdc; --muted:#c3b69f; --panel:rgba(24,19,14,.74); --line:rgba(244,236,220,.2);
  --accent:#e9a84c; --accent-ink:#20160b; --bg:#17120d;
  --display:"Nanum Myeongjo", "Batang", Georgia, serif;
  --latin:"Cormorant Garamond", Georgia, serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.title{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px, env(safe-area-inset-left,0px));
  pointer-events:none;text-shadow:0 1px 14px rgba(0,0,0,.55);max-width:calc(100% - 32px)}
.eyebrow{margin:0;font-family:var(--latin);font-style:italic;font-size:18px;letter-spacing:.04em;color:var(--muted)}
.title h1{margin:2px 0 6px;font-family:var(--display);font-weight:800;font-size:34px;line-height:1.15;text-wrap:balance}
.sub{margin:0;font-size:13px;color:var(--muted);letter-spacing:.01em}
.panel{position:fixed;left:max(16px, env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(370px, calc(100% - 32px));box-sizing:border-box;background:var(--panel);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;
  padding:14px;display:grid;gap:12px}
.group-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.views{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:500 13px/1.2 var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:8px;padding:9px 6px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:rgba(244,236,220,.45)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.time-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.time-head output{font-family:var(--display);font-size:15px;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.hint{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.walk{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px}
button:disabled{opacity:.4;cursor:default}
.status{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status[data-live="1"]::before{background:#7fd38b;box-shadow:0 0 8px #7fd38b}
.me-line{margin:8px 0 0;font-size:12px;color:var(--muted)}
.me-line b{color:var(--ink);font-weight:500}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));z-index:6;background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);max-width:calc(100% - 32px)}
#tip{position:fixed;pointer-events:none;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 11px;font-size:12px;line-height:1.45;color:var(--muted);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);max-width:240px}
#tip b{display:block;font-family:var(--display);font-size:15px;color:var(--ink);font-weight:700}
@media (max-width:520px){
  .title h1{font-size:26px}.eyebrow{font-size:15px}
  .panel{right:max(16px, env(safe-area-inset-right,0px));width:auto;padding:12px;gap:10px}
  .views{grid-template-columns:repeat(2,1fr)}
}
@media (max-height:560px) and (min-width:521px){ .hint{display:none} }
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>

<canvas id="c" aria-label="사그라다 파밀리아 3D 모형"></canvas>

<header class="title">
  <p class="eyebrow">Barcelona · since 1882</p>
  <h1>사그라다 파밀리아</h1>
  <p class="sub">탑 18개 · 사도 12 · 복음사가 4 · 성모 1 · 예수 그리스도 172.5m</p>
</header>

<div id="tip" hidden></div>

<nav class="panel" aria-label="보기 설정">
  <div>
    <p class="group-label">시점</p>
    <div class="views" role="group" aria-label="시점">
      <button id="v-overview" data-view="overview" aria-pressed="true">전경</button>
      <button id="v-nativity" data-view="nativity" aria-pressed="false">탄생 파사드</button>
      <button id="v-passion" data-view="passion" aria-pressed="false">수난 파사드</button>
      <button id="v-interior" data-view="interior" aria-pressed="false">내부</button>
    </div>
  </div>
  <div>
    <div class="time-head"><p class="group-label">시간</p><output id="timeLabel" for="time">석양</output></div>
    <input id="time" type="range" min="0" max="100" value="60" aria-label="하루 중 시간">
    <div class="ticks"><span>새벽</span><span>정오</span><span>석양</span><span>밤</span></div>
  </div>
  <div>
    <p class="group-label">공정</p>
    <div class="seg" role="group" aria-label="공정 단계">
      <button id="p-now" data-phase="now" aria-pressed="true">2026 현재</button>
      <button id="p-done" data-phase="done" aria-pressed="false">완공 예상</button>
    </div>
  </div>
  <div>
    <div class="time-head"><p class="group-label">함께 걷기</p><span id="roomStatus" class="status">연결 확인 중</span></div>
    <div class="walk">
      <button id="walkBtn" aria-pressed="false">순례 시작</button>
      <button id="bowBtn" disabled>합장</button>
      <button id="candleBtn" disabled>초 밝히기</button>
    </div>
    <p class="me-line">내 이름 <b id="myName"></b></p>
  </div>
  <p class="hint" id="hint">드래그로 회전 · 휠/핀치로 확대 · 탑을 가리키면 이름이 나옵니다. 비율과 장식은 단순화한 모형입니다.</p>
</nav>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
THREE.ColorManagement.legacyMode = false;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- seeded random ----------
let seed = 1882;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rand();

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x998877, 450, 2200);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.3, 7000);
camera.position.set(-240, 150, 260);
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(0, 70, -5);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 3; controls.maxDistance = 1400;

// ---------- canvas texture helpers ----------
const cv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const toTex = (c) => { const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso; return t; };
function speckle(g, w, h, n) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = rand() < .5 ? `rgba(255,248,230,${rand() * .18})` : `rgba(60,45,30,${rand() * .16})`;
    g.fillRect(rand() * w, rand() * h, 1 + rand() * 2, 1 + rand() * 2);
  }
}
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fill();
}
function scaleUV(geo, su, sv) { const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv); uv.needsUpdate = true; return geo; }

// Tower skin: sandstone courses with spiral slits (lit from inside at night)
function makeTowerTex() {
  const w = 128, h = 512, c = cv(w, h), e = cv(w, h), g = c.getContext('2d'), ge = e.getContext('2d');
  g.fillStyle = '#cbb796'; g.fillRect(0, 0, w, h); speckle(g, w, h, 2600);
  g.strokeStyle = 'rgba(90,70,45,.16)'; for (let y = 0; y < h; y += 8) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(w, y + .5); g.stroke(); }
  ge.fillStyle = '#000'; ge.fillRect(0, 0, w, h);
  const cols = 4, rows = 16, cw = w / cols, rh = h / rows;
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
    const x = (k + (r % 4) * .25) * cw + cw * .35, y = r * rh + rh * .19, sw = cw * .3, sh = rh * .62;
    for (const dx of [-w, 0, w]) {
      g.fillStyle = '#2d241a'; rrect(g, x + dx, y, sw, sh, sw / 2);
      ge.fillStyle = '#ffcf8a'; rrect(ge, x + dx, y, sw, sh, sw / 2);
    }
  }
  return { map: toTex(c), em: toTex(e) };
}

// Wall bay: parabolic stained-glass window + small rose; cool palette east, warm west (as in the real basilica)
const COOL = ['#1f5fbf', '#2a9d8f', '#3fbf6f', '#79d0c6', '#2b62b0', '#e6d46a', '#5aa8e0'];
const WARM = ['#e0482f', '#f08c2a', '#f5c542', '#c2185b', '#ff7a3d', '#8a3a9e', '#f2a65a'];
function makeBayTex(pal) {
  const w = 128, h = 256, c = cv(w, h), e = cv(w, h), g = c.getContext('2d'), ge = e.getContext('2d');
  g.fillStyle = '#c7b393'; g.fillRect(0, 0, w, h); speckle(g, w, h, 2200);
  g.fillStyle = 'rgba(80,60,40,.22)'; g.fillRect(0, h * .9, w, h * .1);
  ge.fillStyle = '#000'; ge.fillRect(0, 0, w, h);
  const wx = w * .29, ww = w * .42, y0 = h * .22, ys = y0 + ww * 1.05, yb = h * .84;
  const archPath = (ctx) => { ctx.beginPath(); ctx.moveTo(wx, yb); ctx.lineTo(wx, ys);
    ctx.quadraticCurveTo(wx + ww / 2, 2 * y0 - ys, wx + ww, ys); ctx.lineTo(wx + ww, yb); ctx.closePath(); };
  const rose = (ctx) => { ctx.beginPath(); ctx.arc(w / 2, h * .1, w * .1, 0, Math.PI * 2); };
  for (const [ctx, dim] of [[g, true], [ge, false]]) {
    for (const p of [archPath, rose]) {
      ctx.save(); p(ctx); ctx.clip();
      for (let y = 0; y < h; y += 6) for (let x = 0; x < w; x += 6) { ctx.fillStyle = pal[(rand() * pal.length) | 0]; ctx.fillRect(x, y, 6, 6); }
      ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1;
      for (let y = 0; y < h; y += 6) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
      if (dim) { ctx.fillStyle = 'rgba(14,16,22,.74)'; ctx.fillRect(0, 0, w, h); }
      ctx.restore();
    }
  }
  g.strokeStyle = 'rgba(70,52,34,.5)'; g.lineWidth = 3; archPath(g); g.stroke(); rose(g); g.stroke();
  return { map: toTex(c), em: toTex(e) };
}

// Vault ceiling: pale stone with golden hyperboloid skylights
function makeVaultTex() {
  const w = 256, c = cv(w, w), e = cv(w, w), g = c.getContext('2d'), ge = e.getContext('2d');
  g.fillStyle = '#e2d9c8'; g.fillRect(0, 0, w, w); speckle(g, w, w, 1800);
  ge.fillStyle = '#000'; ge.fillRect(0, 0, w, w);
  const disc = (ctx, x, y, r, a, b) => { const gr = ctx.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, a); gr.addColorStop(.35, a); gr.addColorStop(1, b);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };
  const spots = [[w / 2, w / 2, w * .2], [0, 0, w * .14], [w, 0, w * .14], [0, w, w * .14], [w, w, w * .14]];
  for (const [x, y, r] of spots) {
    g.strokeStyle = 'rgba(130,108,78,.28)'; g.lineWidth = 2;
    for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2; g.beginPath(); g.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); g.lineTo(x + Math.cos(a) * r * 1.9, y + Math.sin(a) * r * 1.9); g.stroke(); }
    disc(g, x, y, r, '#ffe7a6', 'rgba(226,217,200,0)');
    disc(ge, x, y, r, '#ffd27a', 'rgba(0,0,0,0)');
  }
  return { map: toTex(c), em: toTex(e) };
}

// City facade: Eixample windows, some lit at night
function makeCityTex() {
  const w = 128, c = cv(w, w), e = cv(w, w), g = c.getContext('2d'), ge = e.getContext('2d');
  g.fillStyle = '#d4c5ab'; g.fillRect(0, 0, w, w); speckle(g, w, w, 900);
  ge.fillStyle = '#000'; ge.fillRect(0, 0, w, w);
  const n = 4, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const x = i * s + s * .3, y = j * s + s * .18;
    g.fillStyle = '#3c362f'; g.fillRect(x, y, s * .4, s * .6);
    g.fillStyle = 'rgba(60,50,40,.45)'; g.fillRect(x - s * .08, y + s * .6, s * .56, s * .05);
    if (rand() < .34) { ge.fillStyle = rand() < .8 ? '#ffd08a' : '#bfd8ff'; ge.fillRect(x, y, s * .4, s * .6); }
  }
  const tm = toTex(c), te = toTex(e); tm.repeat.set(1 / 12, 1 / 12); te.repeat.set(1 / 12, 1 / 12);
  return { map: tm, em: te };
}

// ---------- materials ----------
const WHITE = new THREE.Color(1, 1, 1);
const stoneMat = new THREE.MeshStandardMaterial({ color: '#c3ae8d', roughness: .93 });
const stoneDark = new THREE.MeshStandardMaterial({ color: '#a8936f', roughness: .95 });
const holeMat = new THREE.MeshStandardMaterial({ color: '#1c1610', roughness: 1 });
const colMat = new THREE.MeshStandardMaterial({ color: '#ddd3c2', roughness: .75 });
const tT = makeTowerTex();
const towerMat = new THREE.MeshStandardMaterial({ map: tT.map, emissiveMap: tT.em, emissive: WHITE, emissiveIntensity: 0, roughness: .9 });
const wallMat = (t) => new THREE.MeshStandardMaterial({ map: t.map, emissiveMap: t.em, emissive: WHITE, emissiveIntensity: 0, roughness: .86, side: THREE.DoubleSide });
const wallMats = { cool: wallMat(makeBayTex(COOL)), warm: wallMat(makeBayTex(WARM)), mix: wallMat(makeBayTex(COOL.concat(WARM))) };
const vT = makeVaultTex();
const vaultMat = new THREE.MeshStandardMaterial({ map: vT.map, emissiveMap: vT.em, emissive: WHITE, emissiveIntensity: .35, roughness: .8 });
const roofMat = new THREE.MeshStandardMaterial({ color: '#b39d7c', roughness: .95 });
const mosaic = (c, e = 0.08) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: e, roughness: .35, metalness: .1 });
const redM = mosaic('#b8322a'), goldM = mosaic('#e0ad3a', .12), whiteM = mosaic('#f2eee4', .05), greenM = mosaic('#2f8a55');
const glowMats = [];
const crossMat = new THREE.MeshStandardMaterial({ color: '#f3f6fb', emissive: '#d8e6ff', emissiveIntensity: .2, roughness: .25, metalness: .15 }); glowMats.push(crossMat);
const starMat = new THREE.MeshStandardMaterial({ color: '#e4ecff', emissive: '#c4d6ff', emissiveIntensity: .25, roughness: .15, metalness: .2 }); glowMats.push(starMat);
const ghostMat = new THREE.MeshBasicMaterial({ color: '#f0b25a', wireframe: true, transparent: true, opacity: .26, depthWrite: false });

// ---------- sky, stars, lights ----------
const skyU = { top: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, bot: { value: new THREE.Color() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(3200, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vP; void main(){ float h = vP.y; vec3 c = h > 0.0 ? mix(mid, top, pow(clamp(h,0.0,1.0), 0.45)) : mix(mid, bot, clamp(-h*5.0,0.0,1.0)); gl_FragColor = linearToOutputTexel(vec4(c,1.0)); }'
}));
scene.add(sky);
const starGeo = new THREE.BufferGeometry(); const sp = [];
for (let i = 0; i < 1600; i++) { const th = rand() * Math.PI * 2, ph = Math.acos(rr(.05, 1)); sp.push(3000 * Math.sin(ph) * Math.cos(th), 3000 * Math.cos(ph), 3000 * Math.sin(ph) * Math.sin(th)); }
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
const starMatP = new THREE.PointsMaterial({ color: '#ffffff', size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
scene.add(new THREE.Points(starGeo, starMatP));

const hemi = new THREE.HemisphereLight(0xffffff, 0x6b5a48, .6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -190, right: 190, top: 220, bottom: -190, near: 10, far: 1400 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.4;
scene.add(sun); scene.add(sun.target); sun.target.position.set(0, 40, 0);
const floods = [[230, 10, -2, 32, 70, -2], [-230, 10, -2, -32, 70, -2], [0, 10, 280, 0, 70, 30], [0, 10, -260, 0, 80, -30]].map(([x, y, z, tx, ty, tz]) => {
  const s = new THREE.SpotLight(0xffc488, 0, 0, .42, .7); s.position.set(x, y, z); s.target.position.set(tx, ty, tz); scene.add(s, s.target); return s; });
const coolL = new THREE.PointLight(0x4a86ff, 0, 70); coolL.position.set(16, 18, -2);
const warmL = new THREE.PointLight(0xff7a2e, 0, 70); warmL.position.set(-16, 18, -2);
const naveL = new THREE.PointLight(0xffe2b0, 0, 80); naveL.position.set(0, 30, 20);
scene.add(coolL, warmL, naveL);

// ---------- ground & Eixample city ----------
const PITCH = 133.3, S = 113.3, CH = 15;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), new THREE.MeshStandardMaterial({ color: '#56504a', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
function octShape(s, c) { const h = s / 2, sh = new THREE.Shape();

// WebSocket room: same shape as the claude.ai room API the rest of this file uses
function createWsRoom() {
  const L = { peers: [], conn: [], topics: {} };
  let ws = null, open = false, myId = null, channel = null, retry = 0, queued = false;
  const myPresence = {}, others = new Map();
  let snapshot = Object.freeze([]);
  const wantCh = parseInt(new URLSearchParams(location.search).get('ch'), 10) || null;
  const fire = (arr, v) => arr.forEach(f => { try { f(v); } catch (e) { console.error(e); } });
  function rebuild() {
    const list = [{ peer: myId || 'me', by: null, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: Object.freeze({ ...myPresence }), updatedAt: Date.now() }];
    for (const [id, o] of others) list.push({ peer: id, by: null, isMe: false, sameTab: false, kind: 'viewer', guest: false, presence: o.p, updatedAt: o.at });
    snapshot = Object.freeze(list);
    if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; fire(L.peers, { peers: snapshot }); }); }
  }
  const send = (o) => { if (open && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => { open = true; retry = 0; send({ type: 'hello', ch: wantCh, p: myPresence }); };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (!m || typeof m !== 'object') return;
      if (m.type === 'welcome') {
        myId = m.id; channel = m.ch; others.clear();
        for (const p of m.peers || []) others.set(p.id, { p: Object.freeze(p.p || {}), at: Date.now() });
        rebuild(); fire(L.conn, true);
        for (const c of m.candles || []) fire(L.topics.candle || [], { topic: 'candle', data: c, peer: '', isMe: false, sameTab: false, kind: 'viewer' });
      } else if (m.type === 'presence' && m.id !== myId) { others.set(m.id, { p: Object.freeze(m.p || {}), at: Date.now() }); rebuild(); }
      else if (m.type === 'leave') { others.delete(m.id); rebuild(); }
      else if (m.type === 'event') fire(L.topics[m.topic] || [], { topic: m.topic, data: m.data, peer: m.id, isMe: m.id === myId, sameTab: m.id === myId, kind: 'viewer' });
      else if (m.type === 'full') toast('모든 채널이 가득 찼어요. 잠시 후 다시 시도해 주세요');
    };
    ws.onclose = () => { const was = open; open = false; others.clear(); rebuild(); if (was) fire(L.conn, false);
      setTimeout(connect, Math.min(15000, 600 * 2 ** retry++)); };
    ws.onerror = () => {};
  }
  connect();
  return {
    presence(patch) { for (const k in patch) { if (patch[k] === null) delete myPresence[k]; else myPresence[k] = patch[k]; } send({ type: 'presence', p: patch }); rebuild(); return Promise.resolve(); },
    peers: () => snapshot,
    connected: () => open && myId !== null,
    channel: () => channel,
    emit(topic, data) { send({ type: 'event', topic, data }); return Promise.resolve(); },
    on(topic, fn) { (L.topics[topic] = L.topics[topic] || []).push(fn); return () => {}; },
    onPeers(fn) { L.peers.push(fn); queueMicrotask(() => fn({ peers: snapshot })); return () => {}; },
    onConnection(fn) { L.conn.push(fn); queueMicrotask(() => fn(open)); return () => {}; },
  };
}

(async () => {
  try { room = 'WebSocket' in window ? createWsRoom() : null; } catch (e) { room = null; }
  if (!room) { renderStatus(); return; }
  room.onPeers(ch => syncPeers(ch.peers), () => { room = null; for (const v of peerViews.values()) scene.remove(v.g); peerViews.clear(); renderStatus(); });
  room.onConnection(() => { renderStatus(); if (room && room.connected()) sendPresence(true); });
  room.on('candle', msg => { const d = msg.data || {}; placeCandle(Number(d.x), Number(d.z)); });
  sendPresence(true);
})();
renderStatus();

// movement input
addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input')) return;
  const k = e.key.toLowerCase(); if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'shift'].includes(k)) { keys[k] = true; if (walking && k.startsWith('arrow')) e.preventDefault(); } });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
let downAt = null;
canvas.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!walking || !downAt) return; const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y), dt = performance.now() - downAt.t; downAt = null;
  if (moved > 6 || dt > 450) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const hit = new THREE.Vector3(); if (!ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit)) return;
  if (hit.distanceTo(myPos) > 400) return;
  dest = new THREE.Vector3(clampX(hit.x), 0, clampZ(hit.z)); destMark.position.set(dest.x, .04, dest.z); destMark.visible = true;
});
const vF = new THREE.Vector3(), vR = new THREE.Vector3(), vMove = new THREE.Vector3(), vDelta = new THREE.Vector3();
function updateWalk(dt, now) {
  if (!walking) return;
  const fwd = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0), side = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  vMove.set(0, 0, 0);
  if (fwd || side) {
    dest = null; destMark.visible = false;
    vF.subVectors(controls.target, camera.position).setY(0).normalize(); vR.set(-vF.z, 0, vF.x);
    vMove.addScaledVector(vF, fwd).addScaledVector(vR, side);
  } else if (dest) { vMove.subVectors(dest, myPos).setY(0); if (vMove.length() < .3) { dest = null; destMark.visible = false; vMove.set(0, 0, 0); } }
  const moving = vMove.lengthSq() > 0;
  if (moving && !tween) {
    const step = Math.min(vMove.length(), (keys.shift ? 15 : 6) * dt); vMove.normalize().multiplyScalar(step);
    const nx = clampX(myPos.x + vMove.x), nz = clampZ(myPos.z + vMove.z);
    vDelta.set(nx - myPos.x, 0, nz - myPos.z); myPos.x = nx; myPos.z = nz;
    camera.position.add(vDelta); controls.target.add(vDelta);
    const want = Math.atan2(vMove.x, vMove.z); let dr = want - myRot; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); myRot += dr * Math.min(1, dt * 10);
  }
  if (!tween) controls.target.set(myPos.x, 1.5, myPos.z);
  myAvatar.position.copy(myPos); myAvatar.rotation.y = myRot;
  myAvatar.userData.body.position.y = moving ? Math.abs(Math.sin(now / 140)) * .08 : 0;
  myAvatar.userData.body.rotation.x = bowAngle(bowStart, now);
  setInside(insideAt(myPos.x, myPos.z));
  sendPresence(false);
}
function updateCandles(now) {
  for (let i = candles.length - 1; i >= 0; i--) {
    const c = candles[i], age = now - c.userData.born;
    if (age > 300000) { scene.remove(c); candles.splice(i, 1); continue; }
    const f = c.userData.flame, k = .9 + Math.sin(now / 90 + i) * .06 + Math.sin(now / 37 + i * 3) * .04; f.scale.set(.55 * k, .7 * k, 1);
  }
}

// ---------- loop ----------
applyTime(timeEl.value / 100); setPhase('now');
const clock = new THREE.Clock();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(clock.getDelta(), .05);
  if (tween) { const k = Math.min(1, (now - tween.s) / tween.d), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e); if (k >= 1) tween = null; }
  updateWalk(dt, now); updatePeers(dt, now); updateCandles(now);
  controls.update(); if (walking && camera.position.y < .4) camera.position.y = .4;
  doPick(); renderer.render(scene, camera);
});
})();
</script>
