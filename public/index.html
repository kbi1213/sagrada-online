<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sagrada Família 3D</title>
<meta name="description" content="사그라다 파밀리아를 3D로 함께 걷는 온라인 성당. 설치·가입 없이 접속하세요.">
<meta property="og:title" content="사그라다 파밀리아 · 함께 걷기">
<meta property="og:description" content="지금 접속한 사람들과 3D 성당을 걷고, 합장하고, 초를 밝혀요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL scene, floating title top-left, one control panel bottom-left (full width on phones).
   Single committed look: dusk stone & lamplight, independent of host theme. */
:root{
  --ink:#f4ecdc; --muted:#c3b69f; --panel:rgba(24,19,14,.74); --line:rgba(244,236,220,.2);
  --accent:#e9a84c; --accent-ink:#20160b; --bg:#17120d;
  --display:"Nanum Myeongjo", "Batang", Georgia, serif;
  --latin:"Cormorant Garamond", Georgia, serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.title{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px, env(safe-area-inset-left,0px));
  pointer-events:none;text-shadow:0 1px 14px rgba(0,0,0,.55);max-width:calc(100% - 32px)}
.eyebrow{margin:0;font-family:var(--latin);font-style:italic;font-size:18px;letter-spacing:.04em;color:var(--muted)}
.title h1{margin:2px 0 6px;font-family:var(--display);font-weight:800;font-size:34px;line-height:1.15;text-wrap:balance}
.sub{margin:0;font-size:13px;color:var(--muted);letter-spacing:.01em}
.panel{position:fixed;left:max(16px, env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(370px, calc(100% - 32px));box-sizing:border-box;background:var(--panel);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;
  padding:14px;display:grid;gap:12px;max-height:calc(100% - 120px);overflow-y:auto;overscroll-behavior:contain}
.group-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.views{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:500 13px/1.2 var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:8px;padding:9px 6px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:rgba(244,236,220,.45)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.time-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.time-head output{font-family:var(--display);font-size:15px;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.hint{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.walk{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px}
button:disabled{opacity:.4;cursor:default}
.status{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status[data-live="1"]::before{background:#7fd38b;box-shadow:0 0 8px #7fd38b}
.me-line{margin:8px 0 0;font-size:12px;color:var(--muted)}
.me-line b{color:var(--ink);font-weight:500}
.pick{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.pick button{padding:0;aspect-ratio:1;border-radius:50%;overflow:hidden;font-size:10px;display:grid;place-items:center}
.pick button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px;background:transparent}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));z-index:6;background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);max-width:calc(100% - 32px)}
#tip{position:fixed;pointer-events:none;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 11px;font-size:12px;line-height:1.45;color:var(--muted);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);max-width:240px}
#tip b{display:block;font-family:var(--display);font-size:15px;color:var(--ink);font-weight:700}
@media (max-width:520px){
  .title h1{font-size:26px}.eyebrow{font-size:15px}
  .panel{right:max(16px, env(safe-area-inset-right,0px));width:auto;padding:12px;gap:10px}
  .views{grid-template-columns:repeat(2,1fr)}
}
@media (max-height:560px) and (min-width:521px){ .hint{display:none} }
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.gallery{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px, env(safe-area-inset-right,0px));z-index:4;
  display:grid;justify-items:end;gap:8px;width:min(340px, calc(100% - 32px))}
.gallery>button{background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.gallery figure{margin:0;width:100%;box-sizing:border-box;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px}
.gallery img{display:block;width:100%;max-height:46vh;object-fit:cover;border-radius:8px;background:#0d0a07}
.gallery figcaption{display:grid;gap:2px;font-size:13px}
.gallery figcaption small{font-size:11px;color:var(--muted)}

.tour-btn{width:100%;margin-top:6px;background:rgba(233,168,76,.14);border-color:rgba(233,168,76,.55)}
body.touring .panel, body.touring .title{display:none}
#tourBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;
  width:min(720px, calc(100% - 32px));box-sizing:border-box;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.tour-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tour-head b{font-family:var(--display);font-size:18px}
.tour-head span{font-size:12px;color:var(--muted)}
#tourChips{display:flex;flex-wrap:wrap;gap:6px}
#tourChips button{padding:7px 10px;font-size:12px}
.hot{position:fixed;transform:translate(-50%,-50%);z-index:3;background:var(--panel);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(244,236,220,.4);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap}
.hot::before{content:"↑ ";color:var(--accent)}

.css3d{position:fixed;inset:0;z-index:-1;pointer-events:none}
.screen-el{width:1280px;height:720px;background:#000;backface-visibility:hidden}
.screen-el iframe{display:block;width:1280px;height:720px;border:0}
#screenForm{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:6px}
#screenForm input{min-width:0;font:13px var(--body);color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.screen-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.screen-row button{font-size:12px;padding:8px 4px}

#chatLog{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:4;width:min(320px, calc(100% - 32px));
  display:grid;gap:4px;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#chatLog p{margin:0;font-size:13px;line-height:1.4;background:rgba(24,19,14,.55);border-radius:8px;padding:5px 9px;overflow-wrap:anywhere;transition:opacity .6s}
#chatLog p.old{opacity:.35}
#chatLog b{font-weight:600;margin-right:6px}
#chatOpen{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;
  background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:9px 14px}
#chatForm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;width:min(560px, calc(100% - 32px));
  display:grid;grid-template-columns:1fr auto;gap:6px;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:12px;padding:8px}
#chatInput{min-width:0;font:15px var(--body);color:var(--ink);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
body.touring #chatLog{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.touring #chatForm{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
@media (max-width:520px){ #chatLog{top:calc(120px + env(safe-area-inset-top,0px));bottom:auto;left:max(16px, env(safe-area-inset-left,0px));right:auto}
  #chatOpen{top:calc(64px + env(safe-area-inset-top,0px));bottom:auto} #chatForm{top:calc(110px + env(safe-area-inset-top,0px));bottom:auto} }

#statusBtn{width:100%;margin-top:6px}
#statusModal{position:fixed;inset:0;z-index:8;background:rgba(10,8,6,.78);display:grid;place-items:center;padding:16px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
#statusModal img{max-width:min(1100px,100%);max-height:calc(100vh - 100px);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:block}
#statusModal figcaption{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
#statusModal figure{margin:0}
.gal-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:520px){ .title{max-width:calc(100% - 150px)} .gallery img{max-height:32vh} }
</style>
</head>
<body>

<canvas id="c" aria-label="사그라다 파밀리아 3D 모형"></canvas>

<header class="title">
  <p class="eyebrow">Barcelona · since 1882</p>
  <h1>사그라다 파밀리아</h1>
  <p class="sub">탑 18개 · 사도 12 · 복음사가 4 · 성모 1 · 예수 그리스도 172.5m</p>
</header>

<div id="tip" hidden></div>

<nav class="panel" aria-label="보기 설정">
  <div>
    <p class="group-label">시점</p>
    <div class="views" role="group" aria-label="시점">
      <button id="v-overview" data-view="overview" aria-pressed="true">전경</button>
      <button id="v-nativity" data-view="nativity" aria-pressed="false">탄생 파사드</button>
      <button id="v-passion" data-view="passion" aria-pressed="false">수난 파사드</button>
      <button id="v-interior" data-view="interior" aria-pressed="false">내부</button>
    </div>
    <button id="tourBtn" class="tour-btn">실사 속을 걷기</button>
  </div>
  <div>
    <div class="time-head"><p class="group-label">시간</p><output id="timeLabel" for="time">석양</output></div>
    <input id="time" type="range" min="0" max="100" value="60" aria-label="하루 중 시간">
    <div class="ticks"><span>새벽</span><span>정오</span><span>석양</span><span>밤</span></div>
  </div>
  <div>
    <p class="group-label">공정</p>
    <div class="seg" role="group" aria-label="공정 단계">
      <button id="p-now" data-phase="now" aria-pressed="true">2026 현재</button>
      <button id="p-done" data-phase="done" aria-pressed="false">완공 예상</button>
    </div>
  </div>
  <div>
    <div class="time-head"><p class="group-label">함께 걷기</p><span id="roomStatus" class="status">연결 확인 중</span></div>
    <div class="walk">
      <button id="walkBtn" aria-pressed="false">순례 시작</button>
      <button id="bowBtn" disabled>합장</button>
      <button id="danceBtn" disabled>비보잉</button>
      <button id="candleBtn" disabled>초 밝히기</button>
    </div>
    <p class="me-line">내 이름 <b id="myName"></b></p>
    <div class="pick" id="charPick" role="group" aria-label="캐릭터 고르기"></div>
    <button id="statusBtn" type="button" hidden>상태창 보기</button>
  </div>
  <div>
    <p class="group-label">대형 화면</p>
    <form id="screenForm"><input id="screenUrl" type="url" inputmode="url" placeholder="유튜브 링크 붙여넣기" aria-label="유튜브 링크"><button type="submit">틀기</button></form>
    <div class="screen-row"><button id="screenGo" type="button">보러 가기</button><button id="muteBtn" type="button">소리 켜기</button><button id="screenDefault" type="button">기본 영상</button></div>
  </div>
  <p class="hint" id="hint">드래그로 회전 · 휠/핀치로 확대 · 탑을 가리키면 이름이 나옵니다. 비율과 장식은 단순화한 모형입니다.</p>
</nav>
<aside class="gallery" aria-label="실사 사진">
  <button id="galToggle" aria-expanded="false">실사 사진</button>
  <figure id="galFig" hidden>
    <img id="galImg" alt="" decoding="async">
    <figcaption><span id="galCap"></span><small>Higgsfield로 만든 AI 실사 이미지 · 3D에 쓴 질감의 원본</small></figcaption>
    <div class="gal-nav"><button id="galPrev">이전</button><span id="galIdx"></span><button id="galNext">다음</button></div>
  </figure>
</aside>
<div id="hotspots"></div>
<div id="tourBar" hidden>
  <div class="tour-head"><div><b id="tourName"></b><br><span>WASD·바닥 클릭으로 걷기 · 드래그로 둘러보기 · 표지를 눌러 장소 이동 · Higgsfield AI 실사</span></div>
    <button id="tourExit">3D로 돌아가기</button></div>
  <div id="tourChips" role="group" aria-label="장소"></div>
</div>
<div id="chatLog" hidden aria-live="polite"></div>
<button id="chatOpen" type="button">말하기 (Enter)</button>
<form id="chatForm" hidden><input id="chatInput" maxlength="80" autocomplete="off" placeholder="하고 싶은 말 (80자) · Enter로 보내기, Esc로 닫기" aria-label="채팅 입력"><button type="submit">보내기</button></form>
<div id="statusModal" hidden role="dialog" aria-label="상태창"><figure><img id="statusImg" alt=""><figcaption>Higgsfield로 만든 오리지널 디자인 · 눌러서 닫기</figcaption></figure></div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/objects/Sky.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/SkeletonUtils.js"></script>

{ const p = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = (rand() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }

// x,y already scaled so one texture = Px × Py noise cells (keeps it seamless)
function fbm(x, y, Px, Py = Px, oct = 4) {

  hotLayer.replaceChildren(...(tourOn && tourSpot ? SPOTS.filter(s => s.id !== tourSpot.id).map(s => {
    const b = document.createElement('button'); b.className = 'hot'; const n = peopleAt(s.id);
    b.textContent = n ? `${s.name} · ${n}명` : s.name; b.dataset.spot = s.id; b.addEventListener('click', () => goSpot(s.id)); return b;
  }) : []));
}
function placeSpot(s, t) {
  const m = panoBack;
  m.material.uniforms.map.value = t; m.material.uniforms.C.value.set(s.x, PANO_EYE, s.z);
  m.material.uniforms.yaw.value = Math.atan2(s.f[1], s.f[0]); m.material.uniforms.gR.value = s.r < 6 ? 2.2 : s.r * 1.8; // interiors: columns stand close, so project only the floor right under the pilgrim
  m.position.set(s.x, 0, s.z); m.visible = true;
  fade = { s: performance.now(), d: reduceMotion ? 1 : 600, from: panoFront, to: panoBack };
  [panoFront, panoBack] = [panoBack, panoFront];

}
async function goSpot(id) {
  const s = SPOTS.find(p => p.id === id); if (!s) return;
  toast(`${s.name} 사진을 불러오는 중`);
  const t = await loadPano(id);
  if (!t) { toast('이 장소의 사진을 불러오지 못했어요'); return; }
  if (!tourOn) return;
  toastEl.hidden = true;
  tourSpot = s; tourName.textContent = s.name; placeSpot(s, t);
  // stand a couple of metres in front of where the photo was taken, facing what the photo looks at
  const nx = s.x + s.f[0] * 2, nz = s.z + s.f[1] * 2, dx = nx - myPos.x, dz = nz - myPos.z;
  myPos.set(nx, 0, nz); myRot = Math.atan2(s.f[0], s.f[1]); dest = null; destMark.visible = false;
  camera.position.set(nx - s.f[0] * 4.5, 2.1, nz - s.f[1] * 4.5); controls.target.set(nx, 1.5, nz); tween = null;
  void dx; void dz;
  if (room) room.presence({ s: id }).catch(() => {});
  sendPresence(true); refreshTourUI();
}
function enterTour(id) {
  if (tourOn) { goSpot(id); return; }
  tourOn = true; tip.hidden = true; wasWalking = walking;
  tourHidden = scene.children.filter(o => o.visible && !o.isLight && !o.userData.keepInTour);
  tourHidden.forEach(o => { o.visible = false; });
  tourFog = scene.fog; scene.fog = null;

  document.body.classList.add('touring'); tourBar.hidden = false;

}
function exitTour() {
  if (!tourOn) return;
  tourOn = false; tourSpot = null; fade = null;
  panoFront.visible = panoBack.visible = false; panoFront.material.uniforms.op.value = panoBack.material.uniforms.op.value = 0; shadowDisk.visible = false;
  tourHidden.forEach(o => { o.visible = true; }); tourHidden = [];
  scene.fog = tourFog;
  document.body.classList.remove('touring'); tourBar.hidden = true; hotLayer.replaceChildren();
  if (room) room.presence({ s: null }).catch(() => {});
  controls.minPolarAngle = 0;
  if (!wasWalking) stopWalk(); else { controls.maxDistance = 70; controls.minDistance = 2.5; controls.maxPolarAngle = Math.PI * .49; }
}
// keep the pilgrim on the photographed floor
function clampToSpot(x, z) {
  if (!tourOn || !tourSpot) return [clampX(x), clampZ(z)];
  const dx = x - tourSpot.x, dz = z - tourSpot.z, d = Math.hypot(dx, dz);
  return d <= tourSpot.r ? [x, z] : [tourSpot.x + dx / d * tourSpot.r, tourSpot.z + dz / d * tourSpot.r];
}
tourBtn.addEventListener('click', () => enterTour(VIEW_SPOT[currentView] || 'nativity'));
document.getElementById('tourExit').addEventListener('click', () => { exitTour(); setView('overview'); });
addEventListener('keydown', e => { if (tourOn && e.key === 'Escape' && chatForm.hidden) { exitTour(); setView('overview'); } });
const hotV = new THREE.Vector3();
function updateTour(now) {
  if (fade) {
    const k = Math.min(1, (now - fade.s) / fade.d);
    fade.to.material.uniforms.op.value = k; fade.from.material.uniforms.op.value = 1 - k;
    if (k >= 1) { fade.from.visible = false; fade = null; }
  }
  if (!tourSpot) return;
  for (const el of hotLayer.children) {
    const s = SPOTS.find(p => p.id === el.dataset.spot); const dx = s.x - tourSpot.x, dz = s.z - tourSpot.z, d = Math.hypot(dx, dz);
    hotV.set(tourSpot.x + dx / d * 30, 1.2, tourSpot.z + dz / d * 30).project(camera);
    const vis = hotV.z < 1 && Math.abs(hotV.x) < 1.05 && Math.abs(hotV.y) < 1.05;
    el.style.display = vis ? '' : 'none';
    if (vis) { el._x = (hotV.x + 1) / 2 * innerWidth; el._y = (1 - hotV.y) / 2 * innerHeight; }
  }
  const shown = [...hotLayer.children].filter(el => el.style.display !== 'none').sort((a, b) => a._x - b._x);
  const placed = [];
  for (const el of shown) {
    let y = el._y;
    while (placed.some(p => Math.abs(p.x - el._x) < 150 && Math.abs(p.y - y) < 34)) y += 36;
    placed.push({ x: el._x, y }); el.style.left = el._x + 'px'; el.style.top = y + 'px';
  }
}
window.__tourReady = true; refreshTourUI();


// ---------- big screen hanging over the crossing (YouTube, shared per channel) ----------
const DEFAULT_VIDEO = 'Za3A_9Plm5A';
const SCREEN = { w: 16, h: 9, pos: new THREE.Vector3(0, 25, -8.2) };
const cssRenderer = new THREE.CSS3DRenderer();
cssRenderer.setSize(innerWidth, innerHeight); cssRenderer.domElement.className = 'css3d'; document.body.prepend(cssRenderer.domElement); window.__css = cssRenderer;
const cssScene = new THREE.Scene();
const screenEl = document.createElement('div'); screenEl.className = 'screen-el';
const frame = document.createElement('iframe');
Object.assign(frame, { width: 1280, height: 720, title: '대형 화면', allow: 'autoplay; encrypted-media; picture-in-picture' });
screenEl.appendChild(frame);
const screenObj = new THREE.CSS3DObject(screenEl); screenObj.position.copy(SCREEN.pos); screenObj.scale.setScalar(SCREEN.w / 1280); cssScene.add(screenObj);
// The video sits behind the WebGL canvas; this plane punches a see-through hole so columns in front still hide it.
const screenHoleMat = new THREE.MeshBasicMaterial({ color: 0x000000, opacity: 0, blending: THREE.NoBlending });
const posterTex = texLoader.load('/photos/nave.webp', t => { t.encoding = THREE.sRGBEncoding; });
const posterMat = new THREE.MeshBasicMaterial({ map: posterTex, color: '#9a9590', toneMapped: false });
const screenFace = new THREE.Mesh(new THREE.PlaneGeometry(SCREEN.w, SCREEN.h), posterMat); screenFace.position.copy(SCREEN.pos); scene.add(screenFace);
const bezel = new THREE.Mesh(new THREE.BoxGeometry(SCREEN.w + .8, SCREEN.h + .8, .4), new THREE.MeshStandardMaterial({ color: '#15120f', roughness: .4, metalness: .3 }));
bezel.position.copy(SCREEN.pos).add(new THREE.Vector3(0, 0, -.22)); scene.add(bezel);
const cableMat = new THREE.MeshBasicMaterial({ color: '#2a2622' });
for (const x of [-6, 6]) scene.add(rod(new THREE.Vector3(x, SCREEN.pos.y + SCREEN.h / 2 + .4, SCREEN.pos.z - .2), new THREE.Vector3(x, 44.9, SCREEN.pos.z - .2), .05, .05, cableMat, 4));

let screenVideo = DEFAULT_VIDEO, screenLive = false, screenMuted = true;
const embedUrl = (v) => `https://www.youtube-nocookie.com/embed/${v}?autoplay=1&mute=1&loop=1&playlist=${v}&controls=0&rel=0&playsinline=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}`;
function setScreenLive(on) {
  if (on === screenLive) return; screenLive = on;
  frame.src = on ? embedUrl(screenVideo) : 'about:blank';
  screenFace.material = on ? screenHoleMat : posterMat;
  if (!on) { screenMuted = true; muteBtn.textContent = '소리 켜기'; }
}
function playVideo(v) {
  if (!/^[A-Za-z0-9_-]{11}$/.test(v) || v === screenVideo) return;
  screenVideo = v; if (screenLive) { frame.src = embedUrl(v); screenMuted = true; muteBtn.textContent = '소리 켜기'; }
}
const parseYouTube = (s) => { const m = String(s).trim().match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{11})/) || String(s).trim().match(/^([A-Za-z0-9_-]{11})$/); return m ? m[1] : null; };
const screenForm = document.getElementById('screenForm'), screenUrl = document.getElementById('screenUrl'), muteBtn = document.getElementById('muteBtn');
screenForm.addEventListener('submit', e => {
  e.preventDefault(); const v = parseYouTube(screenUrl.value);
  if (!v) { toast('유튜브 링크를 확인해 주세요'); return; }
  screenUrl.value = '';
  if (room && room.connected()) { room.emit('screen', { v }); toast('대형 화면에 틀었어요. 같은 채널 모두에게 보여요'); }
  else { playVideo(v); toast('대형 화면에 틀었어요'); }
});
document.getElementById('screenDefault').addEventListener('click', () => { if (room && room.connected()) room.emit('screen', { v: DEFAULT_VIDEO }); else playVideo(DEFAULT_VIDEO); });
document.getElementById('screenGo').addEventListener('click', () => { if (tourOn) exitTour(); if (walking) stopWalk(); setView('interior'); });
muteBtn.addEventListener('click', () => {
  if (!screenLive) { toast('성당 안에 들어가면 화면이 켜져요'); return; }
  screenMuted = !screenMuted;
  frame.contentWindow && frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func: screenMuted ? 'mute' : 'unMute', args: [] }), '*');
  if (!screenMuted) frame.contentWindow && frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'setVolume', args: [80] }), '*');
  muteBtn.textContent = screenMuted ? '소리 켜기' : '소리 끄기';
});
if (room) room.on('screen', msg => { const v = msg.data && msg.data.v; if (typeof v === 'string' && v !== screenVideo) { playVideo(v); if (!msg.isMe && !msg.welcome) toast('대형 화면 영상이 바뀌었어요'); } });
let screenCheckAt = 0;
function updateScreen(now) {
  if (now - screenCheckAt < 500) return; screenCheckAt = now;
  const p = walking ? myPos : camera.position;
  setScreenLive(!tourOn && insideAt(p.x, p.z) && p.distanceTo(SCREEN.pos) < 90 || (!tourOn && currentView === 'interior'));
}


// ---------- typed chat: speech bubbles over pilgrims + a short log ----------
const chatForm = document.getElementById('chatForm'), chatInput = document.getElementById('chatInput'), chatLog = document.getElementById('chatLog');
const chatOpenBtn = document.getElementById('chatOpen');
const cleanChat = (s) => String(s).replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁠-⁯]/g, '').trim().slice(0, 80);
function openChat() { chatForm.hidden = false; chatInput.focus(); }
function closeChat() { chatForm.hidden = true; chatInput.value = ''; chatInput.blur(); }
chatOpenBtn.addEventListener('click', () => chatForm.hidden ? openChat() : closeChat());
addEventListener('keydown', e => {
  if (e.key === 'Enter' && chatForm.hidden && !(e.target.closest && e.target.closest('input,textarea,button'))) { e.preventDefault(); openChat(); }
  else if (e.key === 'Escape' && !chatForm.hidden) closeChat();
});
let lastChatAt = 0;
chatForm.addEventListener('submit', e => {
  e.preventDefault(); const t = cleanChat(chatInput.value);
  if (!t) { closeChat(); return; }
  if (performance.now() - lastChatAt < 1200) { toast('조금 천천히 말해 주세요'); return; }
  lastChatAt = performance.now(); chatInput.value = '';
  if (room && room.connected()) room.emit('chat', { t });
  else showChat({ t, n: me.n, c: me.c }, true, null);
});
function bubbleSprite(text) {
  const c = cv(512, 160), g = c.getContext('2d');
  g.font = '500 30px "IBM Plex Sans KR", "Malgun Gothic", sans-serif';
  const lines = []; let line = '';
  for (const ch of [...text]) { if (g.measureText(line + ch).width > 440) { lines.push(line); line = ch; } else line += ch; }
  if (line) lines.push(line);
  if (lines.length > 3) { lines.length = 3; lines[2] = lines[2].slice(0, -1) + '…'; }
  const shown = lines, w = Math.min(492, Math.max(...shown.map(l => g.measureText(l).width)) + 40), h = shown.length * 38 + 26;
  g.fillStyle = 'rgba(250,246,238,.95)'; rrect(g, (512 - w) / 2, 4, w, h, 18);
  g.beginPath(); g.moveTo(240, h + 3); g.lineTo(256, h + 22); g.lineTo(272, h + 3); g.fill();
  g.fillStyle = '#1d150d'; g.textAlign = 'center'; g.textBaseline = 'middle';
  shown.forEach((l, i) => g.fillText(l, 256, 4 + 13 + 19 + i * 38));
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  s.scale.set(3.6, 1.125, 1); s.position.y = 3.1; s.userData.born = performance.now(); return s;
}
function attachBubble(avatar, text) {
  if (!avatar) return;
  if (avatar.userData.bubble) { avatar.remove(avatar.userData.bubble); avatar.userData.bubble.material.map.dispose(); }
  const b = bubbleSprite(text); avatar.add(b); avatar.userData.bubble = b;
}
function showChat(d, isMe, peer) {
  const t = cleanChat(d.t), n = safeName(d.n), c = safeColor(d.c); if (!t) return;
  const row = document.createElement('p'), who = document.createElement('b'), msg = document.createElement('span');
  who.textContent = isMe ? `${n} (나)` : n; who.style.color = c; msg.textContent = t; row.append(who, msg);
  chatLog.append(row); while (chatLog.children.length > 7) chatLog.firstChild.remove();
  chatLog.hidden = false; row.dataset.at = String(performance.now());

if (room) room.on('chat', msg => showChat(msg.data || {}, msg.sameTab, msg.peer));
function updateChat(now) {
  const all = [myAvatar, ...[...peerViews.values()].map(v => v.g)];
  for (const a of all) { const b = a.userData.bubble; if (b && now - b.userData.born > 7000) { a.remove(b); b.material.map.dispose(); a.userData.bubble = null; } }
  for (const row of chatLog.children) row.classList.toggle('old', now - Number(row.dataset.at) > 20000);
}

// ---------- loop ----------
applyTime(timeEl.value / 100); setPhase('now');
const clock = new THREE.Clock();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(clock.getDelta(), .05);
  if (tween) { const k = Math.min(1, (now - tween.s) / tween.d), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e); if (k >= 1) tween = null; }
  if (tourOn) updateTour(now);
  updateWalk(dt, now); updatePeers(dt, now); updateCandles(now); updateChat(now);
  controls.update(); if (walking && camera.position.y < .4) camera.position.y = .4;
  if (!tourOn) doPick(); updateScreen(now); renderer.render(scene, camera); if (screenLive) cssRenderer.render(cssScene, camera);

})();
